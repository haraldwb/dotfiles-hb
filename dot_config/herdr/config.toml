onboarding = false

[theme]
name = "gruvbox"
auto_switch = false

# Keybindings ported from the omarchy tmux config that used to live in
# ~/.config/tmux/tmux.conf. Reference: https://omarchy.org/manual/hotkeys/#tmux
#
# Mapping of the two models, since the names differ:
#   tmux session -> herdr workspace
#   tmux window  -> herdr tab
#   tmux pane    -> herdr pane
#
# herdr names splits after the divider, not the resulting layout, so the two
# split lines below look inverted and are not:
#
#   split_horizontal -> stacked    (new pane below)  = omarchy prefix h
#   split_vertical   -> side by side (new pane beside) = omarchy prefix v
#
# Validate any edit with `herdr config check`: it reports invalid key strings
# AND silently shadowed bindings ("kept keys.X, disabled keys.Y"). Apply with
# `herdr server reload-config`. `herdr config reset-keys` restores the
# defaults after backing this file up.
[keys]
# omarchy's prefix. herdr takes a single string only -- tmux's C-b fallback
# prefix (prefix2) has no equivalent here.
prefix = "ctrl+space"

# herdr puts detach on prefix+q, which omarchy uses to reload the config.
# Detach goes back to tmux's prefix+d.
detach = "prefix+d"
reload_config = "prefix+q"

# Panes
split_horizontal = ["prefix+h", "alt+enter"]
split_vertical = ["prefix+v", "alt+shift+enter"]
# Alt+Esc is kept for parity with omarchy, but never arrives on this machine:
# Windows claims it to cycle windows. Use prefix+x here.
close_pane = ["prefix+x", "alt+esc"]

focus_pane_left = "ctrl+alt+left"
focus_pane_down = "ctrl+alt+down"
focus_pane_up = "ctrl+alt+up"
focus_pane_right = "ctrl+alt+right"

# Direct chords rather than herdr's resize mode, matching omarchy. The Windows
# WezTerm config already frees Ctrl+Alt+Shift+arrows from its own zoom bindings.
resize_pane_left = "ctrl+shift+alt+left"
resize_pane_down = "ctrl+shift+alt+down"
resize_pane_up = "ctrl+shift+alt+up"
resize_pane_right = "ctrl+shift+alt+right"

# No omarchy equivalent. Moved off herdr's prefix+shift+h/j/k/l because
# prefix+shift+k is omarchy's kill-session.
swap_pane_left = "prefix+shift+left"
swap_pane_down = "prefix+shift+down"
swap_pane_up = "prefix+shift+up"
swap_pane_right = "prefix+shift+right"

# Tabs = tmux windows
new_tab = "prefix+c"
rename_tab = "prefix+r"
close_tab = "prefix+k"
switch_tab = ["prefix+1..9", "alt+1..9"]
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"

# Workspaces = tmux sessions
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+k"
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]

# Displaced by the bindings above: rename_pane off prefix+shift+p (now
# previous-workspace), resize_mode off prefix+r (now rename-tab).
rename_pane = "prefix+ctrl+p"
resize_mode = "prefix+ctrl+r"
