# Fallback only. tmux 3.7c has built-in WezTerm detection (tty-features.c)
# that already includes the "extkeys" feature, so this line is normally
# redundant -- but detection relies on WezTerm answering tmux's XTVERSION
# query, and TERM here is xterm-256color, whose built-in feature set does
# NOT include extkeys. Without extkeys, Alt+Shift+Enter arrives identical
# to Alt+Enter and splits vertically instead of horizontally.
#
# To check whether auto-detection is doing the job, run inside tmux:
#   tmux display -p '#{client_termfeatures}'
# If "extkeys" is listed with this line commented out, you can delete it.
set -ag terminal-features ",xterm-256color:extkeys"
