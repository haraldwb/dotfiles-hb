# Fallback only. tmux 3.7c has built-in WezTerm detection (tty-features.c)
# that already includes the "extkeys" feature, so this line is normally
# redundant -- but detection relies on WezTerm answering tmux's XTVERSION
# query, and TERM here is xterm-256color, whose built-in feature set does
# NOT include extkeys. Without extkeys, Alt+Shift+Enter arrives identical
# to Alt+Enter and splits vertically instead of horizontally.
#
# To check whether auto-detection is doing the job, run inside tmux:
#   tmux display -p '#{client_termfeatures}'
# If "extkeys" is listed with this line commented out, you can delete it.
set -ag terminal-features ",xterm-256color:extkeys"

# --- status bar legibility on WezTerm's default palette ---------------------
# omarchy's theme assumes its own palette (blue #7aa2f7, brightblack #444b6a).
# WezTerm's ANSI blue is #5555cc and brightblack #555555, so omarchy's
# "fg=black,bg=blue" came out black-on-dark-blue and inactive windows were
# near-invisible. Using 256-colour indices instead of ANSI slots restores
# omarchy's intended tones without overriding the terminal palette.
#
#   colour111 = #87afff  (omarchy's accent blue is #7aa2f7 - near match)
#   colour245 = #8a8a8a  (muted grey - readable but recedes)
#   colour243 = #767676  (dimmer still, for the hostname)
#   colour235 = #262626  (dark text on the accent badge)
#
# Dial: raise the grey number to brighten (245 -> 250), lower it to mute (245 -> 240).
set -g status-left "#[fg=colour235,bg=colour111,bold] #S #[bg=default] "
set -g window-status-format "#[fg=colour245] #I:#W "
set -g window-status-current-format "#[fg=colour111,bold] #I:#W "
set -g status-right "#[fg=colour111]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=colour243]#h "
set -g pane-active-border-style "fg=colour111"
set -g pane-border-style "fg=colour238"
